services:
  # Backend API - FastAPI en Python
  - type: web
    name: abbysoft-textil-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: FIRST_SUPERUSER_EMAIL
        value: admin@textilapp.com
      - key: FIRST_SUPERUSER_PASSWORD
        value: admin123
      - key: FIRST_SUPERUSER_NOMBRE
        value: Administrador Principal
